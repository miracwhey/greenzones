<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GreenZones</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<script src="https://unpkg.com/@turf/turf@7.1.0/turf.min.js"></script>
<style>
  :root {
    --ok: #1DB954;
    --ban: #E5484D;
    --time: #F76B15;
    --ink: #17191C;
    --ink-2: #5A616B;
    --glass: rgba(255,255,255,.78);
    --stroke: rgba(23,25,28,.08);
    --sat: env(safe-area-inset-top, 54px);
    --sab: env(safe-area-inset-bottom, 24px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, system-ui, "SF Pro Text", sans-serif;
    color: var(--ink);
    background: #E8EAED;
    -webkit-font-smoothing: antialiased;
  }
  #map { position: absolute; inset: 0; }
  .maplibregl-ctrl-attrib { font-size: 9px; opacity: .55; }
  .maplibregl-ctrl-bottom-right { bottom: 224px; }

  .top {
    position: absolute;
    top: calc(var(--sat) + 60px);
    left: 0; right: 0;
    display: flex;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
  }
  .pill {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px 10px 12px;
    border-radius: 100px;
    background: var(--glass);
    backdrop-filter: blur(24px) saturate(1.6);
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
    border: 1px solid var(--stroke);
    box-shadow: 0 8px 32px rgba(23,25,28,.14), 0 1px 2px rgba(23,25,28,.08);
  }
  .pill .dot {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--ok);
    box-shadow: 0 0 0 5px rgba(29,185,84,.18);
    transition: background .3s;
  }
  .pill.s-ban .dot { background: var(--ban); box-shadow: 0 0 0 5px rgba(229,72,77,.18); }
  .pill.s-time .dot { background: var(--time); box-shadow: 0 0 0 5px rgba(247,107,21,.18); }
  .pill .dot svg { width: 15px; height: 15px; stroke: #fff; stroke-width: 3.2; fill: none; }
  .pill .dot .x { display: none; }
  .pill.s-ban .dot .check, .pill.s-time .dot .check { display: none; }
  .pill.s-ban .dot .x, .pill.s-time .dot .x { display: block; }
  .pill .txt { line-height: 1.15; }
  .pill .txt b { font-size: 15px; font-weight: 650; letter-spacing: -.01em; display: block; }
  .pill .txt span { font-size: 12px; color: var(--ink-2); font-weight: 480; }

  .search {
    position: absolute;
    top: calc(var(--sat) + 8px);
    left: 14px; right: 14px;
    height: 40px;
    border-radius: 12px;
    background: var(--glass);
    backdrop-filter: blur(24px) saturate(1.6);
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
    border: 1px solid var(--stroke);
    box-shadow: 0 4px 16px rgba(23,25,28,.08);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 12px;
    z-index: 10;
    color: var(--ink-2);
    font-size: 14px;
  }
  .search svg { width: 16px; height: 16px; stroke: var(--ink-2); stroke-width: 2; fill: none; flex: none; }

  .fabs {
    position: absolute;
    right: 14px;
    bottom: 248px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 10;
  }
  .fab {
    width: 44px; height: 44px;
    border-radius: 14px;
    background: var(--glass);
    backdrop-filter: blur(24px) saturate(1.6);
    -webkit-backdrop-filter: blur(24px) saturate(1.6);
    border: 1px solid var(--stroke);
    box-shadow: 0 6px 24px rgba(23,25,28,.12);
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .fab svg { width: 20px; height: 20px; stroke: var(--ink); stroke-width: 1.8; fill: none; }

  .sheet {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    z-index: 11;
    background: var(--glass);
    backdrop-filter: blur(28px) saturate(1.7);
    -webkit-backdrop-filter: blur(28px) saturate(1.7);
    border-radius: 22px 22px 0 0;
    border-top: 1px solid var(--stroke);
    box-shadow: 0 -8px 40px rgba(23,25,28,.16);
    padding: 8px 18px calc(var(--sab) + 16px);
  }
  .grab { width: 36px; height: 4px; border-radius: 2px; background: rgba(23,25,28,.18); margin: 2px auto 12px; }
  .sheet h2 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); margin-bottom: 10px; }
  .zone-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
  .zone-row + .zone-row { border-top: 1px solid rgba(23,25,28,.06); }
  .zone-ico {
    width: 34px; height: 34px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    flex: none;
  }
  .zone-ico.ban { background: rgba(229,72,77,.12); }
  .zone-ico.time { background: rgba(247,107,21,.12); }
  .zone-ico svg { width: 17px; height: 17px; stroke-width: 1.9; fill: none; }
  .zone-ico.ban svg { stroke: var(--ban); }
  .zone-ico.time svg { stroke: var(--time); }
  .zone-body { flex: 1; min-width: 0; line-height: 1.25; }
  .zone-body b { font-size: 14px; font-weight: 600; letter-spacing: -.01em; display: block; }
  .zone-body span { font-size: 12px; color: var(--ink-2); }
  .zone-dist { font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .badge-live {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 650;
    color: var(--time);
    background: rgba(247,107,21,.12);
    border-radius: 5px;
    padding: 1.5px 6px;
    margin-left: 6px;
    vertical-align: 1px;
  }
  .empty { font-size: 13px; color: var(--ink-2); padding: 6px 0 10px; }

  .puck { position: relative; width: 22px; height: 22px; }
  .puck .core {
    position: absolute; inset: 3px;
    border-radius: 50%;
    background: #0A84FF;
    border: 2.5px solid #fff;
    box-shadow: 0 1px 6px rgba(0,0,0,.3);
  }
  .puck .halo {
    position: absolute; inset: -14px;
    border-radius: 50%;
    background: rgba(10,132,255,.15);
    animation: pulse 2.4s ease-out infinite;
  }
  @keyframes pulse {
    0% { transform: scale(.6); opacity: .9; }
    70% { transform: scale(1.15); opacity: 0; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="search">
  <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
  Ort oder Adresse suchen
</div>

<div class="top">
  <div class="pill" id="pill">
    <div class="dot">
      <svg class="check" viewBox="0 0 24 24"><path d="M4.5 12.5l5 5 10-11"/></svg>
      <svg class="x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </div>
    <div class="txt">
      <b id="pillTitle">Prüfe Standort …</b>
      <span id="pillSub">&nbsp;</span>
    </div>
  </div>
</div>

<div class="fabs">
  <div class="fab" id="locate"><svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/></svg></div>
  <div class="fab"><svg viewBox="0 0 24 24"><path d="m12 3 8.5 4.5L12 12 3.5 7.5 12 3zM3.5 12.2 12 16.7l8.5-4.5M3.5 16.7 12 21.2l8.5-4.5"/></svg></div>
</div>

<div class="sheet">
  <div class="grab"></div>
  <h2>In deiner Nähe</h2>
  <div id="zoneList"><div class="empty">Lade Zonen …</div></div>
</div>

<script>
// ---------- config ----------
const params = new URLSearchParams(location.search);
const USER = {
  lng: parseFloat(params.get("lng") ?? "9.7386"),
  lat: parseFloat(params.get("lat") ?? "52.3728"),
};
const TILES_URL = params.get("tiles") ?? "../data/out/zones.pmtiles";
const NOW_HOUR = params.has("hour") ? parseInt(params.get("hour"), 10) : new Date().getHours();
const TIME_ACTIVE = NOW_HOUR >= 7 && NOW_HOUR < 20;

// ---------- map ----------
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);

const map = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/positron",
  center: [USER.lng, USER.lat],
  zoom: 14.2,
  attributionControl: { compact: true },
});

map.on("load", () => {
  map.addSource("zones", { type: "vector", url: "pmtiles://" + new URL(TILES_URL, location.href).href });

  map.addLayer({
    id: "ban-fill", type: "fill", source: "zones", "source-layer": "ban",
    paint: { "fill-color": "#E5484D", "fill-opacity": 0.16 },
  });
  map.addLayer({
    id: "ban-line", type: "line", source: "zones", "source-layer": "ban",
    paint: { "line-color": "#E5484D", "line-width": 1.6, "line-opacity": 0.75 },
  });
  map.addLayer({
    id: "time-fill", type: "fill", source: "zones", "source-layer": "time",
    paint: { "fill-color": "#F76B15", "fill-opacity": TIME_ACTIVE ? 0.16 : 0.07 },
  });
  map.addLayer({
    id: "time-line", type: "line", source: "zones", "source-layer": "time",
    paint: { "line-color": "#F76B15", "line-width": 1.6, "line-dasharray": [2.2, 1.6], "line-opacity": TIME_ACTIVE ? 0.85 : 0.4 },
  });

  const el = document.createElement("div");
  el.className = "puck";
  el.innerHTML = '<div class="halo"></div><div class="core"></div>';
  new maplibregl.Marker({ element: el }).setLngLat([USER.lng, USER.lat]).addTo(map);

  map.once("idle", () => {
    try { updateStatus(); }
    catch (e) { console.error("updateStatus failed:", e); }
    window.__MAP_READY__ = true;
  });
});

document.getElementById("locate").onclick = () =>
  map.flyTo({ center: [USER.lng, USER.lat], zoom: 15 });

// ---------- status logic ----------
function fmtDist(m) {
  return m >= 1000 ? (m / 1000).toFixed(1).replace(".", ",") + " km" : Math.round(m) + " m";
}

function collectZones(layer) {
  // Tiles im Viewport reichen: Status bezieht sich auf Standortumgebung
  const feats = map.queryRenderedFeatures({ layers: [layer + "-fill"] });
  const seen = new Set();
  const out = [];
  for (const f of feats) {
    const key = f.id ?? JSON.stringify(f.geometry.coordinates[0]?.[0]);
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(f);
  }
  return out;
}

function analyze(layer) {
  const pt = turf.point([USER.lng, USER.lat]);
  let inside = false;
  let nearest = Infinity;
  for (const f of collectZones(layer)) {
    const geom = f.geometry;
    const polys = geom.type === "MultiPolygon"
      ? geom.coordinates.map(c => turf.polygon(c))
      : [turf.polygon(geom.coordinates)];
    for (const poly of polys) {
      if (turf.booleanPointInPolygon(pt, poly)) { inside = true; nearest = 0; break; }
      const lines = turf.flatten(turf.polygonToLine(poly)).features;
      for (const l of lines) {
        const d = turf.pointToLineDistance(pt, l, { units: "meters" });
        if (d < nearest) nearest = d;
      }
    }
    if (inside) break;
  }
  return { inside, nearest };
}

function updateStatus() {
  const pill = document.getElementById("pill");
  const title = document.getElementById("pillTitle");
  const sub = document.getElementById("pillSub");

  const ban = analyze("ban");
  const time = analyze("time");

  pill.classList.remove("s-ban", "s-time");
  if (ban.inside) {
    pill.classList.add("s-ban");
    title.textContent = "Hier verboten";
    sub.textContent = "Verbotszone · ganztägig";
  } else if (time.inside && TIME_ACTIVE) {
    pill.classList.add("s-time");
    title.textContent = "Jetzt verboten";
    sub.textContent = "Fußgängerzone · frei ab 20:00";
  } else {
    title.textContent = "Hier erlaubt";
    const cands = [ban.nearest, TIME_ACTIVE ? time.nearest : Infinity].filter(Number.isFinite);
    sub.textContent = cands.length
      ? "Nächste Verbotszone in " + fmtDist(Math.min(...cands))
      : "Keine Verbotszone in Sichtweite";
  }

  renderList(ban, time);
}

function renderList(ban, time) {
  const list = document.getElementById("zoneList");
  const rows = [];
  if (Number.isFinite(ban.nearest)) {
    rows.push({
      cls: "ban", dist: ban.nearest,
      title: "Verbotszone",
      subtitle: "100 m Radius · ganztägig",
      icon: '<svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="9" rx="1.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>',
    });
  }
  if (Number.isFinite(time.nearest)) {
    rows.push({
      cls: "time", dist: time.nearest,
      title: "Fußgängerzone" + (TIME_ACTIVE ? '<span class="badge-live">JETZT VERBOTEN</span>' : ""),
      subtitle: "Verboten 7–20 Uhr · frei ab 20:00",
      icon: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
    });
  }
  rows.sort((a, b) => a.dist - b.dist);
  list.innerHTML = rows.length
    ? rows.map(r => `
      <div class="zone-row">
        <div class="zone-ico ${r.cls}">${r.icon}</div>
        <div class="zone-body"><b>${r.title}</b><span>${r.subtitle}</span></div>
        <div class="zone-dist">${r.dist === 0 ? "hier" : fmtDist(r.dist)}</div>
      </div>`).join("")
    : '<div class="empty">Keine Zonen im Kartenausschnitt.</div>';
}
</script>
</body>
</html>
