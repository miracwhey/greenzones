<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>GreenZones — iPhone-Vorschau</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #101214;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .phone {
    width: 390px;
    height: 844px;
    border-radius: 54px;
    border: 10px solid #1c1e21;
    box-shadow: 0 40px 120px rgba(0,0,0,.6), 0 0 0 2px #33363a;
    overflow: hidden;
    position: relative;
    background: #fff;
  }
  .island {
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    width: 122px; height: 36px;
    border-radius: 20px;
    background: #000;
    z-index: 50;
  }
  iframe { width: 100%; height: 100%; border: 0; }
  .hint {
    position: fixed;
    bottom: 18px; left: 0; right: 0;
    text-align: center;
    color: #6b7280;
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="island"></div>
  <iframe src="index.html" title="GreenZones Mockup"></iframe>
</div>
<div class="hint">GreenZones Mockup · Demo-Zonen Hannover Mitte · Karte ist live (zoom/pan)</div>
</body>
</html>
