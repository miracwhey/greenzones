<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; }
  body { width: 1024px; height: 1024px; overflow: hidden; }
  .bg {
    width: 1024px; height: 1024px;
    background:
      radial-gradient(140% 120% at 22% 14%, #f5f7f9 0%, #e7eaee 55%, #d8dde3 100%);
    display: grid;
    place-items: center;
    position: relative;
  }
  svg.streets {
    position: absolute; inset: 0;
    opacity: .5;
  }
  svg.mark {
    position: relative;
    width: 640px;
    height: 640px;
    filter: drop-shadow(0 18px 40px rgba(23,25,28,.10));
  }
</style>
</head>
<body>
<div class="bg">
  <svg class="streets" viewBox="0 0 1024 1024" fill="none" stroke="#c9cfd7" stroke-linecap="round">
    <path d="M-40 268 L430 236 L1080 296" stroke-width="11"/>
    <path d="M-40 806 L390 842 L1080 768" stroke-width="11"/>
    <path d="M212 -40 L252 470 L196 1080" stroke-width="9"/>
    <path d="M844 -40 L812 540 L868 1080" stroke-width="9"/>
    <path d="M-40 530 L150 518 L1080 552" stroke-width="5.5"/>
    <path d="M640 -40 L610 240 L660 1080" stroke-width="5.5" opacity=".7"/>
  </svg>
  <svg class="mark" viewBox="0 0 96 96" fill="none">
    <circle cx="48" cy="48" r="38.5" stroke="#E5484D" stroke-width="3.2" stroke-dasharray="4.6 4.4" opacity="0.85" stroke-linecap="round"/>
    <circle cx="48" cy="48" r="25" stroke="#F76B15" stroke-width="3.4" opacity="0.92"/>
    <circle cx="48" cy="48" r="12.5" fill="#1DB954"/>
    <circle cx="48" cy="48" r="12.5" fill="none" stroke="#ffffff" stroke-width="2.8"/>
    <circle cx="44.5" cy="44.2" r="4.6" fill="#ffffff" opacity="0.28"/>
  </svg>
</div>
</body>
</html>
