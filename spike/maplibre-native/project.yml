name: GreenZonesSpike

options:
  bundleIdPrefix: com.greenzones
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    from: 6.10.0

targets:
  GreenZonesSpike:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Fixtures/**"
      # Fixture-Fotos des Mockups als Resources — gleiche Dateinamen, echte Fotos
      # tauscht man ohne Codeaenderung aus.
      - path: Sources/Fixtures
        buildPhase: resources
      # Eine Quelle: die pmtiles des Web-Clients v1 werden referenziert, nicht kopiert.
      - path: ../../client/public/zones.pmtiles
        buildPhase: resources
    dependencies:
      - package: MapLibre
        product: MapLibre
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: GZ Spike
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Automatic
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.greenzones.spike
        DEVELOPMENT_TEAM: KXJRXU59ZB
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
