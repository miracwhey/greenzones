name: GreenZones

options:
  bundleIdPrefix: de.leonvalentin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Der Neubau schreibt seine eigenen Entitlements-Dateien (eine je Umgebung),
  # xcodegen soll keine dritte generieren.
  groupSortPosition: top

configs:
  Debug: debug
  Release: release
  # Store-Identitaet aus SPEC E1 — nur fuer Archive/TestFlight (W6).
  Distribution: release

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.28.0
  GreenZonesKit:
    path: Packages/GreenZonesKit

settings:
  base:
    DEVELOPMENT_TEAM: KXJRXU59ZB
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "2.0"
    # v1-TestFlight endete bei Build 3.
    CURRENT_PROJECT_VERSION: "4"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      GZ_BUNDLE_ID: de.leonvalentin.greenzones.dev
      GZ_DISPLAY_NAME: GZ Dev
    Release:
      GZ_BUNDLE_ID: de.leonvalentin.greenzones.dev
      GZ_DISPLAY_NAME: GZ Dev
    Distribution:
      GZ_BUNDLE_ID: de.leonvalentin.greenzones
      GZ_DISPLAY_NAME: GreenZones

targets:
  GreenZones:
    type: application
    platform: iOS
    sources:
      - path: GreenZones
        excludes:
          - "Resources/*.entitlements"
      # Eine Zonen-Quelle: die pmtiles des Web-Clients v1 werden referenziert,
      # nicht kopiert (SPEC 2).
      - path: ../client/public/zones.pmtiles
        buildPhase: resources
      # W2: Orts-Index der Suche. Bau-Erzeugnis (nicht im Git), erzeugt von
      # Scripts/gen.sh vor jedem xcodegen-Lauf — deshalb explizit gelistet:
      # fehlt die Datei beim Erzeugen, soll das Projekt laut scheitern und nicht
      # still eine App ohne Ortsverzeichnis bauen.
      - path: GreenZones/Resources/Generated/places.sqlite
        buildPhase: resources
    dependencies:
      - package: MapLibre
        product: MapLibre
      - package: GreenZonesKit
        product: GreenZonesKit
      - target: NotificationService
        embed: true
    info:
      path: GreenZones/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(GZ_DISPLAY_NAME)
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CKSharingSupported: true
        # ProMotion: ohne diesen Key rendert die Karte trotz
        # preferredFramesPerSecond = .maximum nur 60 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        UIBackgroundModes:
          - remote-notification
        NSLocationWhenInUseUsageDescription: GreenZones nutzt deinen Standort, um dir live anzuzeigen, ob Cannabis-Konsum an deinem Ort gerade erlaubt ist. Dein Standort bleibt auf dem Gerät.
        NSCameraUsageDescription: Für Snaps an deinen Spots und auf der Karte.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GZ_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: GreenZones/Resources/GreenZones.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: ""
      configs:
        Distribution:
          CODE_SIGN_ENTITLEMENTS: GreenZones/Resources/GreenZones-Distribution.entitlements

  # Bedienung statt Aussehen: das Blatt (`gzSheet`) baut Tippen daneben, Wischen
  # am Griff und die Einfahrt selbst — ein Screenshot beweist davon nichts.
  GreenZonesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GreenZonesUITests
    dependencies:
      - target: GreenZones
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GZ_BUNDLE_ID).uitests
        TEST_TARGET_NAME: GreenZones
        GENERATE_INFOPLIST_FILE: YES

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes:
          - "*.entitlements"
    dependencies:
      - package: GreenZonesKit
        product: GreenZonesKit
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: NotificationService
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GZ_BUNDLE_ID).NotificationService
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements

schemes:
  GreenZones:
    build:
      targets:
        GreenZones: all
        GreenZonesUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GreenZonesUITests
    archive:
      config: Distribution
