name: GreenZones

options:
  bundleIdPrefix: de.leonvalentin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Der Neubau schreibt seine eigenen Entitlements-Dateien (eine je Umgebung),
  # xcodegen soll keine dritte generieren.
  groupSortPosition: top

configs:
  Debug: debug
  Release: release
  # Store-Identitaet aus SPEC E1 — nur fuer Archive/TestFlight (W6).
  Distribution: release

packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.28.0
  GreenZonesKit:
    path: Packages/GreenZonesKit

settings:
  base:
    DEVELOPMENT_TEAM: KXJRXU59ZB
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "2.0"
    # v1-TestFlight endete bei Build 3.
    CURRENT_PROJECT_VERSION: "5"
    # TARGETED_DEVICE_FAMILY steht bewusst NICHT hier: xcodegen schreibt jedem
    # Target seinen eigenen Default "1,2", und Target-Settings schlagen
    # Projekt-Settings. Ein Wert an dieser Stelle sieht richtig aus und wirkt
    # nicht — Build 4 ging deshalb als iPad-App zu Apple und wurde bei der
    # Einreichung mit SCREENSHOT_REQUIRED.APP_IPAD_PRO_3GEN_129 abgewiesen.
    # Der Wert gehoert in `settings.base` JEDES Targets (siehe unten).
    # Pruefen nie an dieser Datei, immer an der Autorität:
    #   xcodebuild -target <T> -configuration Distribution -showBuildSettings
    ENABLE_USER_SCRIPT_SANDBOXING: NO
  configs:
    Debug:
      GZ_BUNDLE_ID: de.leonvalentin.greenzones.dev
      GZ_DISPLAY_NAME: GZ Dev
    Release:
      GZ_BUNDLE_ID: de.leonvalentin.greenzones.dev
      GZ_DISPLAY_NAME: GZ Dev
    Distribution:
      GZ_BUNDLE_ID: de.leonvalentin.greenzones
      GZ_DISPLAY_NAME: GreenZones

targets:
  GreenZones:
    type: application
    platform: iOS
    sources:
      - path: GreenZones
        excludes:
          - "Resources/*.entitlements"
      # Eine Zonen-Quelle: die pmtiles des Web-Clients v1 werden referenziert,
      # nicht kopiert (SPEC 2).
      - path: ../client/public/zones.pmtiles
        buildPhase: resources
      # W2: Orts-Index der Suche. Bau-Erzeugnis (nicht im Git), erzeugt von
      # Scripts/gen.sh vor jedem xcodegen-Lauf — deshalb explizit gelistet:
      # fehlt die Datei beim Erzeugen, soll das Projekt laut scheitern und nicht
      # still eine App ohne Ortsverzeichnis bauen.
      - path: GreenZones/Resources/Generated/places.sqlite
        buildPhase: resources
      # Karten-Style im Bundle. Einzeln gelistet aus demselben Grund wie oben:
      # fehlt er, soll der Bau scheitern. Er traegt nicht nur das Aussehen —
      # die Zonen-Layer haengen an seinem Lade-Ereignis, ohne ihn zeigt die
      # Karte ohne Empfang gar nichts an.
      - path: GreenZones/Resources/Map/style-positron.json
        buildPhase: resources
      - path: GreenZones/Resources/Map/style-dark.json
        buildPhase: resources
    dependencies:
      - package: MapLibre
        product: MapLibre
      - package: GreenZonesKit
        product: GreenZonesKit
      - target: NotificationService
        embed: true
    info:
      path: GreenZones/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(GZ_DISPLAY_NAME)
        CFBundleDevelopmentRegion: de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        CKSharingSupported: true
        # ProMotion: ohne diesen Key rendert die Karte trotz
        # preferredFramesPerSecond = .maximum nur 60 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        UIBackgroundModes:
          - remote-notification
        # Der Satz muss stimmen, auch im Randfall: die LAUFENDE Ortung bleibt
        # wirklich auf dem Gerät, aber ein Spot und ein Snap tragen den Ort, an
        # dem sie entstanden sind, in die geteilte iCloud. Die frühere Fassung
        # endete auf „Dein Standort bleibt auf dem Gerät." — das war für die
        # Ortung wahr und für alles Geteilte falsch.
        NSLocationWhenInUseUsageDescription: GreenZones nutzt deinen Standort, um dir live anzuzeigen, ob Cannabis-Konsum an deinem Ort gerade erlaubt ist. Die laufende Ortung bleibt dabei auf dem Gerät. Nur wenn du selbst einen Spot anlegst oder einen Snap aufnimmst, wird dieser eine Ort mitgespeichert und mit den Freunden geteilt, die ihn sehen dürfen.
        NSCameraUsageDescription: Für Snaps an deinen Spots und auf der Karte. GreenZones nimmt nur live in der App auf und greift nie auf deine Fotomediathek zu; Ort und Gerät stehen nicht im Bild.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Automatic
        UIRequiresFullScreen: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GZ_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: GreenZones/Resources/GreenZones.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: ""
        # Nur iPhone. Hochformat-Sperre, UIRequiresFullScreen und jedes Blatt
        # sind auf iPhone-Breite gerechnet; als iPad-App waere das ausgeliefert,
        # ohne je auf einem iPad gelaufen zu sein.
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        # W5: Die vier Fixture-Fotos der Screenshot-Routen liegen im Bundle,
        # aber NUR im Debug-Build — der Fixture-Pfad selbst ist `#if DEBUG`.
        # Ohne diesen Ausschluss traege jede ausgelieferte App knapp 1 MB
        # Bilder mit, die kein Code je oeffnet.
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: snap1.jpg snap2.jpg snap3.jpg snap4.jpg
        Distribution:
          CODE_SIGN_ENTITLEMENTS: GreenZones/Resources/GreenZones-Distribution.entitlements
          EXCLUDED_SOURCE_FILE_NAMES: snap1.jpg snap2.jpg snap3.jpg snap4.jpg

  # Bedienung statt Aussehen: das Blatt (`gzSheet`) baut Tippen daneben, Wischen
  # am Griff und die Einfahrt selbst — ein Screenshot beweist davon nichts.
  GreenZonesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GreenZonesUITests
    dependencies:
      - target: GreenZones
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GZ_BUNDLE_ID).uitests
        TEST_TARGET_NAME: GreenZones
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes:
          - "*.entitlements"
    dependencies:
      - package: GreenZonesKit
        product: GreenZonesKit
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: NotificationService
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(GZ_BUNDLE_ID).NotificationService
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        # Die appex geht mit ins Bundle — eine iPad-faehige Extension in einer
        # iPhone-App ist genau die Inkonsistenz, die die Validierung findet.
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  GreenZones:
    build:
      targets:
        GreenZones: all
        GreenZonesUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GreenZonesUITests
    archive:
      config: Distribution
